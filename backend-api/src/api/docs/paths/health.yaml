/api/health:
  get:
    tags:
      - System
    summary: Health check
    description: Returns the health status of the API service.
    security: []
    responses:
      "200":
        description: Service is healthy
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthResponseSchema"

/api/health/ready:
  get:
    tags:
      - System
    summary: Readiness check
    description: Checks if the service is ready to accept requests (database connectivity).
    security: []
    responses:
      "200":
        description: Service is ready
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: ready
      "503":
        description: Service is not ready
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: not ready
