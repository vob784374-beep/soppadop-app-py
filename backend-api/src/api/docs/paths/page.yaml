# ═══════════════════════════════════════════════════
#  Public Page API
# ═══════════════════════════════════════════════════

/api/public-page:
  get:
    tags:
      - Public Page
    summary: Get public page content
    description: Returns all visible published sections with their contents for the public page.
    security: []
    responses:
      "200":
        description: Public page data
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    groups:
                      type: array
                      items:
                        $ref: "#/components/schemas/PageSectionSchema"

/api/public-page/sections/{section_id}:
  get:
    tags:
      - Public Page
    summary: Get public section contents
    description: Returns paginated contents of a visible published section.
    security: []
    parameters:
      - name: section_id
        in: path
        required: true
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
    responses:
      "200":
        description: Section with paginated contents
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/PageSectionSchema"
      "404":
        description: Section not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

# ═══════════════════════════════════════════════════
#  Admin Page — Sections CRUD
# ═══════════════════════════════════════════════════

/api/admin/page/sections:
  get:
    tags:
      - Page Admin
    summary: List all sections
    description: Paginated list of page sections with search and filters.
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
      - name: search
        in: query
        schema:
          type: string
        description: Search by title or description
      - name: section_type
        in: query
        schema:
          type: string
          enum: [general, blog, gallery, travel, review, video, featured]
      - name: status
        in: query
        schema:
          type: string
          enum: [draft, published]
      - name: is_visible
        in: query
        schema:
          type: boolean
    responses:
      "200":
        description: Paginated sections list
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    sections:
                      type: array
                      items:
                        $ref: "#/components/schemas/PageSectionSchema"
                    total:
                      type: integer
                    page:
                      type: integer
                    pages:
                      type: integer
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
  post:
    tags:
      - Page Admin
    summary: Create a new section
    description: Create a new page section with the given properties.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PageSectionCreateSchema"
    responses:
      "201":
        description: Section created
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    section:
                      $ref: "#/components/schemas/PageSectionSchema"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/sections/{section_id}:
  get:
    tags:
      - Page Admin
    summary: Get section by ID
    parameters:
      - name: section_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Section details
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    section:
                      $ref: "#/components/schemas/PageSectionSchema"
      "404":
        description: Section not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
  patch:
    tags:
      - Page Admin
    summary: Update a section
    parameters:
      - name: section_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PageSectionUpdateSchema"
    responses:
      "200":
        description: Section updated
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    section:
                      $ref: "#/components/schemas/PageSectionSchema"
      "404":
        description: Section not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
  delete:
    tags:
      - Page Admin
    summary: Delete a section
    description: Delete a section and all its contents.
    parameters:
      - name: section_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Section deleted
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageResponseSchema"
      "404":
        description: Section not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/sections/reorder:
  post:
    tags:
      - Page Admin
    summary: Reorder sections
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - orders
            properties:
              orders:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    sort_order:
                      type: integer
    responses:
      "200":
        description: Sections reordered
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageResponseSchema"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

