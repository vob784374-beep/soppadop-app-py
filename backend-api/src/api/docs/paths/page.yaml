# ═══════════════════════════════════════════════════
#  Admin Page — Content CRUD
# ═══════════════════════════════════════════════════

/api/admin/page/sections/{section_id}/contents:
  get:
    tags:
      - Page Admin
    summary: List contents of a section
    description: Paginated list of contents within a section.
    parameters:
      - name: section_id
        in: path
        required: true
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
      - name: search
        in: query
        schema:
          type: string
        description: Search by title, subtitle, or body
      - name: is_visible
        in: query
        schema:
          type: boolean
    responses:
      "200":
        description: Paginated contents
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    contents:
                      type: array
                      items:
                        $ref: "#/components/schemas/SectionContentSchema"
                    total:
                      type: integer
                    page:
                      type: integer
                    pages:
                      type: integer
      "404":
        description: Section not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/contents:
  post:
    tags:
      - Page Admin
    summary: Create new content
    description: Add a new content item to a section.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SectionContentCreateSchema"
    responses:
      "201":
        description: Content created
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    content:
                      $ref: "#/components/schemas/SectionContentSchema"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/contents/{content_id}:
  patch:
    tags:
      - Page Admin
    summary: Update content
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SectionContentUpdateSchema"
    responses:
      "200":
        description: Content updated
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    content:
                      $ref: "#/components/schemas/SectionContentSchema"
      "404":
        description: Content not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
  delete:
    tags:
      - Page Admin
    summary: Delete content
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Content deleted
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageResponseSchema"
      "404":
        description: Content not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

# ═══════════════════════════════════════════════════
#  Admin Page — Templates
# ═══════════════════════════════════════════════════

/api/admin/page/templates:
  get:
    tags:
      - Page Admin
    summary: List all templates
    description: Returns all available section templates and page templates.
    responses:
      "200":
        description: Templates list
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    section_templates:
                      type: array
                      items:
                        $ref: "#/components/schemas/TemplateSchema"
                    page_templates:
                      type: array
                      items:
                        $ref: "#/components/schemas/TemplateSchema"

/api/admin/page/templates/section/{template_id}/apply:
  post:
    tags:
      - Page Admin
    summary: Apply section template
    description: Create a new section from a template, or add template content to an existing section.
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              section_id:
                type: integer
                description: If provided, add template content to this existing section
    responses:
      "201":
        description: Template applied
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    section:
                      $ref: "#/components/schemas/PageSectionSchema"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/templates/page/{template_id}/apply:
  post:
    tags:
      - Page Admin
    summary: Apply page template
    description: Create an entire page with multiple sections and contents from a template.
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
    responses:
      "201":
        description: Page template applied
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    sections:
                      type: array
                      items:
                        $ref: "#/components/schemas/PageSectionSchema"
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"
