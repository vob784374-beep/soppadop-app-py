/api/admin/page/sections/display/batch:
  post:
    tags:
      - Page Admin
    summary: Batch display operations
    description: Perform show/hide/publish/unpublish/set on multiple sections at once.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - action
              - section_ids
            properties:
              action:
                type: string
                enum: [show, hide, publish, unpublish, set]
              section_ids:
                type: array
                items:
                  type: integer
              configs:
                type: array
                items:
                  type: object
                  properties:
                    section_id:
                      type: integer
                    is_visible:
                      type: boolean
                    status:
                      type: string
    responses:
      "200":
        description: Batch operation completed
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    count:
                      type: integer
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponseSchema"

/api/admin/page/sections/show-all:
  post:
    tags:
      - Page Admin
    summary: Show all sections
    responses:
      "200":
        description: All sections shown
        content:
