PermissionSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: Permission ID
    name:
      type: string
      description: "Permission name (e.g. users.create)"
    resource:
      type: string
      description: "Resource name (e.g. users)"
    action:
      type: string
      description: "Action name (e.g. create)"
    description:
      type: string
      description: Permission description
  required:
    - name
    - resource
    - action

RoleSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: Role ID
    name:
      type: string
      description: Role name
    description:
      type: string
      description: Role description
    is_system:
      type: boolean
      readOnly: true
      description: System role (cannot be deleted)
    is_super_admin:
      type: boolean
      readOnly: true
      description: Super admin role (owner only)
    permissions:
      type: array
      items:
        $ref: "#/components/schemas/PermissionSchema"
      readOnly: true
      description: Assigned permissions
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: Creation time
    updated_at:
      type: string
      format: date-time
      readOnly: true
      description: Last update time
  required:
    - name

RoleCreateSchema:
  type: object
  properties:
    name:
      type: string
      description: Role name
      example: editor
    description:
      type: string
      description: Role description
      example: Can edit content
  required:
    - name

RoleUpdateSchema:
  type: object
  properties:
    name:
      type: string
      description: New role name
    description:
      type: string
      description: New description

UserSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: User ID
    email:
      type: string
      description: User email
    username:
      type: string
      description: Username
    role:
      $ref: "#/components/schemas/RoleSchema"
      description: User role with permissions
    is_active:
      type: boolean
      description: Account active status
    is_owner:
      type: boolean
      readOnly: true
      description: Owner account (super admin)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: Account creation time
    updated_at:
      type: string
      format: date-time
      readOnly: true
      description: Last update time
  required:
    - email
    - username

RegisterRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: User email
      example: user@example.com
    username:
      type: string
      description: Username
      example: johndoe
    password:
      type: string
      description: User password
      example: secret123
    role:
      type: string
      description: "Role name (admin, manager, client)"
      example: client
      default: client
  required:
    - email
    - username
    - password

LoginRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: User email
      example: user@example.com
    password:
      type: string
      description: User password
      example: secret123
  required:
    - email
    - password

UserUpdateRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: New email
    username:
      type: string
      description: New username
    role_id:
      type: integer
      description: New role ID
    is_active:
      type: boolean
      description: Active status

LoginResponseSchema:
  type: object
  properties:
    message:
      type: string
      description: Success message
    access_token:
      type: string
      description: JWT access token
    refresh_token:
      type: string
      description: JWT refresh token
    user:
      $ref: "#/components/schemas/UserSchema"
      description: User info with role

RegisterResponseSchema:
  type: object
  properties:
    message:
      type: string
      description: Success message
    user:
      $ref: "#/components/schemas/UserSchema"
      description: Created user info

RefreshResponseSchema:
  type: object
  properties:
    access_token:
      type: string
      description: New JWT access token

MessageResponseSchema:
  type: object
  properties:
    message:
      type: string
      description: Response message

ErrorResponseSchema:
  type: object
  properties:
    error:
      type: string
      description: Error message

HealthResponseSchema:
  type: object
  properties:
    status:
      type: string
      description: Service status
    service:
      type: string
      description: Service name

ForgotPasswordRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: User email
      example: user@example.com
  required:
    - email

SendVerificationRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: Email to send verification code to
      example: user@example.com
    purpose:
      type: string
      enum:
        - reset_password
        - update_email
        - update_username
      description: Purpose of verification
  required:
    - email
    - purpose

SendVerificationResponseSchema:
  type: object
  properties:
    message:
      type: string
    verification_code:
      type: string
      description: Verification code (expires in 10 minutes)
    expires_in:
      type: string

ResetPasswordRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: User email
      example: user@example.com
    verification_code:
      type: string
      description: Verification code from send-verification
    new_password:
      type: string
      description: New password (min 8 characters)
      example: newpassword123
  required:
    - email
    - verification_code
    - new_password

UpdateEmailRequestSchema:
  type: object
  properties:
    email:
      type: string
      description: New email address
      example: newemail@example.com
    password:
      type: string
      description: Current password for verification
    verification_code:
      type: string
      description: Verification code sent to current email
  required:
    - email
    - password
    - verification_code

UpdateUsernameRequestSchema:
  type: object
  properties:
    username:
      type: string
      description: New username
      example: newusername
      minLength: 3
      maxLength: 100
    password:
      type: string
      description: Current password for verification
    verification_code:
      type: string
      description: Verification code sent to current email
  required:
    - username
    - password
    - verification_code

ResourceSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: Resource ID
    display_name:
      type: string
      description: Custom display name
    filename:
      type: string
      description: Stored filename
    original_name:
      type: string
      description: Original uploaded filename
    file_type:
      type: string
      description: "File type category (image, video, document, archive, other)"
    mime_type:
      type: string
      description: MIME type
    size:
      type: integer
      format: int64
      description: File size in bytes
    cloudinary_url:
      type: string
      description: Cloudinary secure URL
    cloudinary_public_id:
      type: string
      description: Cloudinary public identifier
    resource_type:
      type: string
      description: "Cloudinary resource type (image, video, raw)"
    collection:
      type: string
      description: Collection name
    folder:
      type: string
      description: Folder name
    format:
      type: string
      description: File format extension
    width:
      type: integer
      description: Image/video width (if applicable)
    height:
      type: integer
      description: Image/video height (if applicable)
    version:
      type: integer
      description: Cloudinary version number
    tags:
      type: string
      description: Comma-separated tags
    description:
      type: string
      description: File description
    download_count:
      type: integer
      description: Number of times downloaded
    uploaded_by:
      type: integer
      description: Uploader user ID
    uploaded_by_user:
      type: string
      description: Uploader username
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true
  required:
    - original_name
    - file_type
    - cloudinary_url

ResourceCollectionSchema:
  type: object
  properties:
    name:
      type: string
      description: Collection name
    count:
      type: integer
      description: Number of files in collection

ResourceFolderSchema:
  type: object
  properties:
    name:
      type: string
      description: Folder name
    file_count:
      type: integer
      description: Number of files in folder
    total_size:
      type: integer
      format: int64
      description: Total size of files in folder

ResourceStatsSchema:
  type: object
  properties:
    total_files:
      type: integer
    total_size:
      type: integer
      format: int64
    by_type:
      type: object
      additionalProperties:
        type: integer
    by_collection:
      type: object
      additionalProperties:
        type: integer

PageSectionSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: Section ID
    title:
      type: string
      description: Section title
    section_type:
      type: string
      enum: [general, blog, gallery, travel, review, video, featured]
      description: Section type
    description:
      type: string
      description: Section description
    cover_image:
      type: string
      description: Cover image URL
    sort_order:
      type: integer
      description: Display order
    is_visible:
      type: boolean
      description: Visibility on public page
    status:
      type: string
      enum: [draft, published]
      description: Publication status
    layout:
      type: string
      enum: [grid, list, hero, carousel]
      description: Display layout
    max_items:
      type: integer
      description: Maximum items to display
    background_color:
      type: string
      description: Background color (hex)
    template_group:
      type: string
      description: Template group identifier
    group_order:
      type: integer
      description: Order within template group
    created_by:
      type: integer
      description: Creator user ID
    created_by_user:
      type: string
      description: Creator username
    content_count:
      type: integer
      description: Number of contents in section
    contents:
      type: array
      items:
        $ref: "#/components/schemas/SectionContentSchema"
      description: Section contents (admin view)
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true
  required:
    - title

PageSectionCreateSchema:
  type: object
  properties:
    title:
      type: string
      description: Section title
      example: My Blog Section
    section_type:
      type: string
      enum: [general, blog, gallery, travel, review, video, featured]
      default: general
    description:
      type: string
    cover_image:
      type: string
    sort_order:
      type: integer
    is_visible:
      type: boolean
      default: true
    status:
      type: string
      enum: [draft, published]
      default: draft
    layout:
      type: string
      enum: [grid, list, hero, carousel]
      default: grid
    max_items:
      type: integer
      default: 6
    background_color:
      type: string
  required:
    - title

PageSectionUpdateSchema:
  type: object
  properties:
    title:
      type: string
    section_type:
      type: string
      enum: [general, blog, gallery, travel, review, video, featured]
    description:
      type: string
    cover_image:
      type: string
    sort_order:
      type: integer
    is_visible:
      type: boolean
    status:
      type: string
      enum: [draft, published]
    layout:
      type: string
      enum: [grid, list, hero, carousel]
    max_items:
      type: integer
    background_color:
      type: string

SectionContentSchema:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      description: Content ID
    section_id:
      type: integer
      description: Parent section ID
    title:
      type: string
      description: Content title
    subtitle:
      type: string
      description: Content subtitle
    body:
      type: string
      description: Content body text
    image_url:
      type: string
      description: Image URL
    video_url:
      type: string
      description: Video URL
    link_url:
      type: string
      description: External link URL
    tags:
      type: string
      description: Comma-separated tags
    author:
      type: string
      description: Author name
    sort_order:
      type: integer
      description: Display order
    is_visible:
      type: boolean
      description: Visibility
    content_date:
      type: string
      format: date-time
      description: Associated date
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true

SectionContentCreateSchema:
  type: object
  properties:
    section_id:
      type: integer
      description: Parent section ID
    title:
      type: string
    subtitle:
      type: string
    body:
      type: string
    image_url:
      type: string
    video_url:
      type: string
    link_url:
      type: string
    tags:
      type: string
    author:
      type: string
    sort_order:
      type: integer
    is_visible:
      type: boolean
      default: true
    content_date:
      type: string
      format: date-time
  required:
    - section_id

SectionContentUpdateSchema:
  type: object
  properties:
    title:
      type: string
    subtitle:
      type: string
    body:
      type: string
    image_url:
      type: string
    video_url:
      type: string
    link_url:
      type: string
    tags:
      type: string
    author:
      type: string
    sort_order:
      type: integer
    is_visible:
      type: boolean
    content_date:
      type: string
      format: date-time

TemplateSchema:
  type: object
  properties:
    id:
      type: string
      description: Template identifier
    name:
      type: string
      description: Template name
    description:
      type: string
      description: Template description
    section_type:
      type: string
      description: Section type for section templates
    layout:
      type: string
      description: Layout type
    contents:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          subtitle:
            type: string
          image_url:
            type: string
      description: Preview contents (section templates)
    sections:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          layout:
            type: string
          contents:
            type: array
            items:
              type: object
      description: Preview sections (page templates)
