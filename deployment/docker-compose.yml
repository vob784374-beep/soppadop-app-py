version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: soppadop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-soppadop_db}
      MYSQL_USER: ${DB_USER:-soppadop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    container_name: soppadop-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${DB_USER:-soppadop}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-soppadop_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-owner@soppadop.com}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-owner}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-SuperAdmin@123}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
      BACKUP_AUTO_ENABLED: ${BACKUP_AUTO_ENABLED:-false}
      BACKUP_AUTO_INTERVAL_HOURS: ${BACKUP_AUTO_INTERVAL_HOURS:-24}
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
      - ../backend-api/backups:/app/backups

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: soppadop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  backend_logs:
